spring:
  application:
    name: tracking-service

  datasource:
    url: jdbc:postgresql://localhost:5433/deliveryflow_tracking
    username: deliveryflow
    password: deliveryflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create        # Tymczasowo – zastąpione przez 'none' gdy pojawią się migracje Flyway
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false            # Włączone gdy pojawią się skrypty w db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
