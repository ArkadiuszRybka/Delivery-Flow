name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate throwaway JWT keypair for tests
        run: |
          mkdir -p order-service/src/main/resources/certs
          mkdir -p api-gateway/src/main/resources/certs
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out order-service/src/main/resources/certs/private.pem
          openssl rsa -pubout \
            -in order-service/src/main/resources/certs/private.pem \
            -out order-service/src/main/resources/certs/public.pem
          cp order-service/src/main/resources/certs/public.pem \
            api-gateway/src/main/resources/certs/public.pem

      - name: Build and test
        run: mvn -B verify

  build-and-push-images:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [api-gateway, order-service, tracking-service, notification-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::404842057803:role/deliveryflow-github-actions-ecr
          aws-region: eu-central-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            404842057803.dkr.ecr.eu-central-1.amazonaws.com/deliveryflow-${{ matrix.service }}:${{ github.sha }}
            404842057803.dkr.ecr.eu-central-1.amazonaws.com/deliveryflow-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-gitops-manifests:
    needs: build-and-push-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump image tags in Helm values
        run: |
          for svc in api-gateway order-service tracking-service notification-service; do
            sed -i "s|^  tag: .*|  tag: \"${{ github.sha }}\"|" helm/$svc/values.yaml
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/*/values.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
          else
            git commit -m "chore: bump image tags to ${{ github.sha }} [skip ci]"
            git push
          fi
