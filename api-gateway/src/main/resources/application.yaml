spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: order-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/orders/**, /api/v1/products/**, /api/v1/admin/**

          - id: tracking-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/v1/tracking/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
