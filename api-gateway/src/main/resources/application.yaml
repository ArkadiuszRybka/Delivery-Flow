spring:
  application:
    name: api-gateway

  web:
    resources:
      add-mappings: false

server:
  port: 8080

jwt:
  public-key: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public.pem}

gateway:
  routes:
    order-service-uri: ${ORDER_SERVICE_URI:http://localhost:8081}
    tracking-service-uri: ${TRACKING_SERVICE_URI:http://localhost:8082}

resilience4j:
  circuitbreaker:
    instances:
      orderService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      trackingService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
