spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5433/deliveryflow_orders
    username: deliveryflow
    password: deliveryflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create        # Tymczasowo – zastąpione przez 'none' gdy pojawią się migracje Flyway
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false            # Włączone gdy pojawią się skrypty w db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.deliveryflow.*"

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
