apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials-sync
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: deliveryflow-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: deliveryflow/rds/master-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: deliveryflow/rds/master-credentials
        property: password
