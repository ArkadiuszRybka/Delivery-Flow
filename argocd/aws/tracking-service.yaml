apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tracking-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ArkadiuszRybka/Delivery-Flow.git
    targetRevision: main
    path: helm/tracking-service
    helm:
      valueFiles:
        - values.yaml
        - values-aws.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
