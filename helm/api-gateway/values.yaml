image:
  repository: ghcr.io/arkadiuszrybka/delivery-flow-api-gateway
  tag: "8f2a26cfd36b3d20c8b22723870622bacb489581"
  pullPolicy: IfNotPresent

replicaCount: 1

containerPort: 8080
managementPort: 8090

service:
  type: NodePort
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

appSecret: api-gateway-secrets

routes:
  orderServiceUri: http://order-service:8081
  trackingServiceUri: http://tracking-service:8082
