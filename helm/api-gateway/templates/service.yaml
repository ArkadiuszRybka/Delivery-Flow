# Public API port only. Kept in a separate Service from the management port on purpose:
# /actuator/** is permitAll in SecurityConfig, so 8090 must never share a Service/Ingress path with 8080.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  type: {{ .Values.service.type }}
